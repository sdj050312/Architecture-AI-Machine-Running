<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>AI 건축/시공 분석 챗봇</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div id="chat-container">
        <div id="chat-header">
            <h3>🏗️ AI 시공/투자 분석 도우미</h3>
        </div>
        <div id="chat-box">
            <!-- 대화 내용이 여기에 쌓입니다 -->
            <div class="bot-msg">안녕하세요! 분석하고 싶은 부지 주소나 건축 궁금증을 말씀해주세요.</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="user-input" placeholder="주소를 입력하거나 질문을 입력하세요...">
            <button id="send-btn">전송</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
